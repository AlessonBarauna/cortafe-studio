<!doctype html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CortaFé Studio</title>
  <meta name="description" content="Estúdio local para transformar mensagens longas em cortes marcantes.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
  <link href="/styles.css" rel="stylesheet"><link href="/social.css" rel="stylesheet"><link href="/editor.css" rel="stylesheet"><link href="/timeline.css" rel="stylesheet"><link href="/professional-editor.css" rel="stylesheet"><link href="/full-source-editor.css" rel="stylesheet"><link href="/subtitles.css" rel="stylesheet"><link href="/titles.css" rel="stylesheet"><link href="/candidate-analysis.css" rel="stylesheet"><link href="/checkpoints.css" rel="stylesheet"><link href="/publishing.css" rel="stylesheet"><link href="/diagnostics.css" rel="stylesheet"><link href="/deletion.css" rel="stylesheet"><link href="/render-status.css" rel="stylesheet"><link href="/factory.css" rel="stylesheet"><link href="/quality.css" rel="stylesheet">
</head>
<body>
  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
  <nav class="navbar navbar-expand-lg studio-nav sticky-top"><div class="container-fluid px-lg-5">
    <a class="navbar-brand d-flex align-items-center gap-3" href="#" data-route="home"><span class="brand-mark">CF</span><span><b>CortaFé</b><small>STUDIO LOCAL</small></span></a>
    <div class="d-flex gap-2 align-items-center"><span id="toolStatus" class="status-pill"><i></i> verificando ferramentas</span><button class="btn btn-outline-light" data-action="diagnostics">Diagnóstico</button><button class="btn btn-outline-light" data-action="social">Publicar</button><button class="btn btn-gold" data-action="new">Novo projeto</button></div>
  </div></nav>
  <main id="app" class="container-fluid px-3 px-lg-5 py-4 py-lg-5"></main>
  <div id="toast" class="studio-toast"></div>

  <template id="homeTemplate">
    <section class="hero row g-4 align-items-end mb-5"><div class="col-xl-8">
      <span class="eyebrow">EDIÇÃO INTELIGENTE · 100% LOCAL</span>
      <h1>Uma mensagem longa.<br><em>Momentos que permanecem.</em></h1>
      <p>Transforme pregações, podcasts, aulas, conteúdos motivacionais, negócios e tecnologia em cortes verticais prontos para compartilhar.</p>
    </div><div class="col-xl-4 text-xl-end"><button class="btn btn-hero" data-action="new">Criar primeiro corte <span>↗</span></button></div></section>
    <section class="section-head"><div><span class="eyebrow">SUA BIBLIOTECA</span><h2>Projetos recentes</h2></div><button class="btn btn-outline-light" data-action="refresh">Atualizar</button></section>
    <div id="projects" class="project-grid"></div>
  </template>

  <template id="newTemplate">
    <div class="workspace-title"><button class="back-link" data-route="home">← Biblioteca</button><span class="eyebrow">NOVO PROJETO</span><h1>De onde vem a mensagem?</h1></div>
    <form id="projectForm" class="row g-4">
      <div class="col-xl-8"><div class="source-panel">
        <div class="source-tabs" role="tablist"><button type="button" class="active" data-source="url">Link do YouTube</button><button type="button" data-source="upload">Arquivo do computador</button></div>
        <div id="urlSource" class="source-body"><div class="d-flex justify-content-between align-items-center"><label class="form-label">Cole um ou vários links</label><span class="badge rounded-pill text-bg-warning">LOTE · ATÉ 20</span></div><div class="url-field align-items-start"><span class="mt-2">▶</span><textarea class="form-control" name="url" rows="4" placeholder="Um link do YouTube por linha"></textarea></div><small>Um link cria um projeto. Várias linhas entram juntas na fila local, sem custo por uso.</small></div>
        <div id="uploadSource" class="source-body d-none"><label id="dropZone" class="drop-zone"><input name="file" type="file" accept="video/*,audio/*" hidden><span class="upload-icon">↑</span><strong>Arraste seu vídeo aqui</strong><small>MP4, MOV, MKV, WebM, MP3 ou WAV</small></label></div>
      </div></div>
      <div class="col-xl-4"><aside class="settings-panel"><span class="panel-number">01</span><h3>Direção do corte</h3>
        <label class="form-label">Nome do projeto <span class="text-secondary">(opcional)</span></label><input class="form-control" name="name" placeholder="Em branco, usa o título do YouTube"><small class="text-secondary d-block mt-1">Para links, o título original será usado automaticamente.</small>
        <label class="form-label mt-3">Perfil editorial</label><select class="form-select" name="contentType"><option value="pregacao">CortaFé · Pregação</option><option value="louvor">CortaFé · Louvor</option><option value="podcast">Podcast / entrevista</option><option value="aula">Educação / aula</option><option value="motivacao">Motivação / desenvolvimento</option><option value="negocios">Negócios / marketing</option><option value="tecnologia">Tecnologia / programação</option></select>
        <label class="form-label mt-3">Tema desejado <span class="text-secondary">(opcional)</span></label><input class="form-control" name="topic" placeholder="Ex.: fé, família, propósito">
        <div class="row g-2 mt-2"><div class="col-4"><label class="form-label">Cortes</label><input class="form-control" name="clipCount" type="number" value="20" min="1" max="20"></div><div class="col-4"><label class="form-label">Mín. (s)</label><input class="form-control" name="minDuration" type="number" value="60" readonly></div><div class="col-4"><label class="form-label">Máx. (s)</label><input class="form-control" name="maxDuration" type="number" value="75" readonly></div></div><small class="text-secondary d-block mt-2">O padrão é 20 cortes automáticos de 60–75 s. Depois você pode ajustar livremente o início e o fim no editor.</small>
        <label class="form-label mt-3">Precisão da transcrição</label><select class="form-select" name="whisperModel"><option value="base">Rápida para CPU · Base</option><option value="small">Mais precisa · Small</option><option value="medium">Alta precisão · Medium</option><option value="large-v3">Máxima · Large v3</option></select>
        <button class="btn btn-hero w-100 mt-4" type="submit">Analisar mensagem <span>→</span></button>
      </aside></div>
    </form>
  </template>

  <template id="projectTemplate"><div id="projectView"></div></template>
  <template id="factoryTemplate"><div id="factoryView"></div></template>
  <template id="diagnosticsTemplate"><div class="workspace-title"><button class="back-link" data-route="home">← Biblioteca</button><span class="eyebrow">SAÚDE DO ESTÚDIO</span><h1>Diagnóstico<br>do sistema.</h1><p class="text-secondary">Ferramentas, capacidade e alertas sem expor seus dados.</p></div><div id="diagnosticsView"><div class="processing-stage py-5">Verificando ambiente…</div></div></template>
  <template id="socialTemplate">
    <div class="workspace-title"><button class="back-link" data-route="home">← Biblioteca</button><span class="eyebrow">CENTRAL DE PUBLICAÇÃO</span><h1>Suas contas.<br>Um só estúdio.</h1><p class="text-secondary">Configure os aplicativos oficiais e conecte suas contas sem expor senhas.</p></div>
    <div id="socialAccounts" class="project-grid"></div>
    <div class="studio-panel p-4 mt-4"><h3>Histórico de publicações</h3><div id="publishHistory" class="mt-3 text-secondary">Nenhuma publicação nesta sessão.</div></div>
  </template>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script><script src="/app.js"></script><script src="/scoring.js"></script><script src="/editor.js"></script><script src="/timeline.js"></script><script src="/professional-editor.js"></script><script src="/subtitles.js"></script><script src="/subtitle-sync.js"></script><script src="/titles.js"></script><script src="/profiles.js"></script><script src="/checkpoints.js"></script><script src="/storage.js"></script><script src="/publishing.js"></script><script src="/diagnostics.js"></script><script src="/deletion.js"></script><script src="/render-status.js"></script>
  <script src="/factory.js"></script><script src="/quality.js"></script>
  <script src="/candidate-analysis.js"></script>
</body></html>
