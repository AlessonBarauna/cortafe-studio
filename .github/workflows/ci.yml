name: Verificar projeto
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: src/CortaFeStudio.Api/CortaFeStudio.Api.csproj
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Garantir FFmpeg para o teste de renderização
        shell: pwsh
        run: |
          $ffmpeg = Get-Command ffmpeg.exe -ErrorAction SilentlyContinue
          $ffprobe = Get-Command ffprobe.exe -ErrorAction SilentlyContinue

          if (-not $ffmpeg -or -not $ffprobe) {
            choco install ffmpeg --no-progress -y
          }

          $searchRoots = @('C:\ProgramData\chocolatey\lib', 'C:\tools') | Where-Object { Test-Path $_ }
          $ffmpegPath = (Get-Command ffmpeg.exe -ErrorAction SilentlyContinue)?.Source
          $ffprobePath = (Get-Command ffprobe.exe -ErrorAction SilentlyContinue)?.Source

          if (-not $ffmpegPath -or -not $ffprobePath) {
            $realFfmpeg = Get-ChildItem -Path $searchRoots -Filter ffmpeg.exe -File -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -notmatch '\\chocolatey\\bin\\' } |
              Select-Object -First 1

            if (-not $realFfmpeg) {
              throw 'ffmpeg.exe não foi encontrado após a instalação do Chocolatey.'
            }

            $ffmpegPath = $realFfmpeg.FullName
            $ffprobeCandidate = Join-Path $realFfmpeg.DirectoryName 'ffprobe.exe'
            if (-not (Test-Path $ffprobeCandidate)) {
              throw "ffprobe.exe não foi encontrado ao lado de $ffmpegPath"
            }
            $ffprobePath = $ffprobeCandidate
          }

          $toolsDir = Join-Path $env:GITHUB_WORKSPACE 'src\CortaFeStudio.Api\tools'
          New-Item -ItemType Directory -Force -Path $toolsDir | Out-Null
          Copy-Item $ffmpegPath (Join-Path $toolsDir 'ffmpeg.exe') -Force
          Copy-Item $ffprobePath (Join-Path $toolsDir 'ffprobe.exe') -Force

          & (Join-Path $toolsDir 'ffmpeg.exe') -version | Select-Object -First 1
          & (Join-Path $toolsDir 'ffprobe.exe') -version | Select-Object -First 1
      - run: dotnet restore CortaFeStudio.sln --configfile NuGet.Config
      - run: dotnet build CortaFeStudio.sln -c Release --no-restore
      - name: Executar testes automatizados
        run: dotnet test CortaFeStudio.sln -c Release --no-build
      - name: Validar JavaScript
        shell: pwsh
        run: Get-ChildItem src/CortaFeStudio.Api/wwwroot -Filter *.js | ForEach-Object { node --check $_.FullName }
      - name: Verificar segredos versionados
        shell: pwsh
        run: if (git ls-files | Select-String 'storage/|credentials.protected|\.cfbackup$') { throw 'Arquivo privado encontrado no Git.' }
